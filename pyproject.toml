[project]
name = "hybrid-rag-benchmark"
version = "0.1.0"
description = "Hybrid RAG benchmarking scaffold"
requires-python = ">=3.10"

dependencies = [
	"fastapi",
	"uvicorn[standard]",
	"langgraph",
	"langchain-core",
	"langchain-openai",
	"langchain-qdrant",
	"langchain-huggingface",
	"langchain-text-splitters",
	"qdrant-client",
	"pydantic-settings",
	"python-dotenv",
	"ml>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

# Optional heavy ML packages (install only for experiments/environments with GPU or sufficient resources)
ml = [
	"sentence-transformers",
	"torch", 
	"transformers",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*", "evaluation", "evaluation.*"]
